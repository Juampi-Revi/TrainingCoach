services:

  # ── Base de datos PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:15
    restart: always
    mem_limit: 512m
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
      POSTGRES_DB:       ${POSTGRES_DB:-training_db}
    ports:
      - "${DB_PORT:-5434}:5432"   # DBeaver → localhost:5434
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-training_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── API (Next.js backend) ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    ports:
      - "3003:3003"
    environment:
      DATABASE_URL:            postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-adminpassword}@db:5432/${POSTGRES_DB:-training_db}?schema=public
      JWT_SECRET:              ${JWT_SECRET:?JWT_SECRET is required}
      NEXTAUTH_URL:            ${NEXTAUTH_URL:-http://localhost:3003}
      FRONTEND_URL:            ${FRONTEND_URL:-http://localhost:3001}
      CLOUDINARY_CLOUD_NAME:   ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY:      ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET:   ${CLOUDINARY_API_SECRET:-}
      NODE_ENV:                production
    depends_on:
      db:
        condition: service_healthy

  # ── Web (Next.js frontend) ───────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC vars are baked in at build time — rebuild if this changes
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3003/api/v1}
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - api

  # ── Docker cleanup (cron semanal) ────────────────────────────────────────────
  cleanup:
    image: docker:27-cli
    restart: always
    mem_limit: 64m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: >
      sh -c "
        echo '0 3 * * 0 docker builder prune -a -f && docker container prune -f && docker image prune -f' > /etc/crontabs/root &&
        crond -f -l 2
      "

volumes:
  postgres_data:
