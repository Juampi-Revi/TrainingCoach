<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>REGEN · Training App</title>
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin: 0; padding: 0; background: #0B0B0C; }
  body { font-family: 'Space Grotesk', system-ui, sans-serif; }
  /* Floating theme toggle */
  .theme-toggle {
    position: fixed; top: 16px; right: 16px; z-index: 500;
    display: flex; gap: 4px; padding: 4px;
    background: rgba(20,20,23,.9); backdrop-filter: blur(12px);
    border: 1px solid #33333A; border-radius: 10px;
    font-family: 'Space Grotesk', sans-serif;
  }
  .theme-toggle button {
    padding: 6px 12px; border: none; background: transparent;
    color: #8D8D94; border-radius: 7px; cursor: pointer;
    font-size: 12px; font-weight: 600; letter-spacing: .02em;
  }
  .theme-toggle button.active { background: #26262C; color: #F5F5F4; }
  [data-theme="light"] .theme-toggle { background: rgba(255,255,255,.92); border-color: #CECEC7; }
  [data-theme="light"] .theme-toggle button { color: #6A6A6E; }
  [data-theme="light"] .theme-toggle button.active { background: #E6E6E1; color: #0B0B0C; }
</style>
</head>
<body>
<div id="root"></div>

<div class="theme-toggle" id="themeToggle">
  <button data-t="dark" class="active">Dark</button>
  <button data-t="light">Light</button>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ds-components.jsx"></script>
<script type="text/babel" src="ds-page.jsx"></script>
<script type="text/babel" src="client-screens.jsx"></script>
<script type="text/babel" src="client-screens-v2.jsx"></script>
<script type="text/babel" src="coach-screens.jsx"></script>
<script type="text/babel" src="coach-template-editor-v2.jsx"></script>
<script type="text/babel" src="v3-screens.jsx"></script>
<script type="text/babel" src="v4-screens.jsx"></script>

<script type="text/babel">
/* ─── Tweak + Edit-mode bootstrapping ─── */
const TWEAKS = /*EDITMODE-BEGIN*/{
  "theme": "dark"
}/*EDITMODE-END*/;

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('#themeToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.t === t);
  });
}
applyTheme(TWEAKS.theme);

document.getElementById('themeToggle').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  const t = e.target.dataset.t;
  applyTheme(t);
  window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { theme: t } }, '*');
});

/* Edit-mode contract (host toolbar toggle) */
window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.type === '__activate_edit_mode') document.getElementById('themeToggle').style.display = 'flex';
  if (d.type === '__deactivate_edit_mode') document.getElementById('themeToggle').style.display = 'none';
});
window.parent.postMessage({ type: '__edit_mode_available' }, '*');

/* ─── App root ─── */
function App() {
  return (
    <DesignCanvas>
      <DCSection id="ds" title="Design System" subtitle="Tokens, tipografía, color, componentes">
        <DCArtboard id="ds-main" label="System · v0.1" width={1360} height={1800}>
          <DSPage />
        </DCArtboard>
      </DCSection>

      <DCSection id="client" title="Client · Mobile" subtitle="Alumno — 8 pantallas · 320×680 · Dark primario, gestos de una mano">
        <DCArtboard id="home" label="01 · Home / Semana" width={320} height={680}>
          <ClientHome />
        </DCArtboard>
        <DCArtboard id="workout-detail" label="02 · Workout detail" width={320} height={680}>
          <ClientWorkoutDetail />
        </DCArtboard>
        <DCArtboard id="session-progress" label="03 · Sesión en progreso" width={320} height={680}>
          <ClientSessionInProgress />
        </DCArtboard>
        <DCArtboard id="session-complete" label="04 · Sesión completada" width={320} height={680}>
          <ClientSessionCompleted />
        </DCArtboard>
        <DCArtboard id="comments" label="05 · Comentarios · sesión" width={320} height={680}>
          <ClientComments />
        </DCArtboard>
        <DCArtboard id="ex-comments" label="06 · Comentarios · ejercicio" width={320} height={680}>
          <ClientExerciseComments />
        </DCArtboard>
        <DCArtboard id="history" label="07 · Historial" width={320} height={680}>
          <ClientHistory />
        </DCArtboard>
        <DCArtboard id="empty" label="08 · Empty · plan en revisión" width={320} height={680}>
          <ClientEmpty />
        </DCArtboard>
      </DCSection>

      <DCSection id="coach" title="Coach · Desktop" subtitle="Coach — 7 pantallas · 1240×820 · densidad media, tablas y paneles">
        <DCArtboard id="dashboard" label="01 · Dashboard" width={1240} height={820}>
          <CoachDashboard />
        </DCArtboard>
        <DCArtboard id="athletes" label="02 · Alumnos · lista" width={1240} height={820}>
          <CoachAthletes />
        </DCArtboard>
        <DCArtboard id="athlete-detail" label="03 · Alumno detail" width={1240} height={820}>
          <CoachAthleteDetail />
        </DCArtboard>
        <DCArtboard id="session-detail" label="04 · Sesión detail + feedback" width={1240} height={820}>
          <CoachSessionDetail />
        </DCArtboard>
        <DCArtboard id="plans" label="05 · Planes · lista" width={1240} height={820}>
          <CoachPlans />
        </DCArtboard>
        <DCArtboard id="plan-detail" label="06 · Plan detail · semanas" width={1240} height={820}>
          <CoachPlanDetail />
        </DCArtboard>
        <DCArtboard id="template-editor" label="07 · Workout template editor" width={1240} height={820}>
          <CoachTemplateEditor />
        </DCArtboard>
      </DCSection>

      <DCSection id="v4" title="V4 · Lifestyle metrics + Intervalos HIIT" subtitle="Brief: tamaños de imagen · Mi panel del alumno · Logger de comida · Editor con bloques HIIT · Pantalla de intervalos">
        <DCArtboard id="v4-images" label="00 · Imágenes de ejercicio · specs" width={1240} height={820}>
          <ImageGuidelines />
        </DCArtboard>
        <DCArtboard id="v4-mypanel" label="01 · Alumno · Mi panel (métricas)" width={320} height={680}>
          <ClientMyPanel />
        </DCArtboard>
        <DCArtboard id="v4-foodlog" label="02 · Logger rápido · comida + score" width={320} height={680}>
          <QuickFoodLogger />
        </DCArtboard>
        <DCArtboard id="v4-editor-hiit" label="03 · Coach · Editor con bloques HIIT" width={1240} height={820}>
          <CoachTemplateEditorV3 />
        </DCArtboard>
        <DCArtboard id="v4-interval" label="04 · Alumno · Ejecución de intervalos" width={320} height={680}>
          <ClientIntervalScreen />
        </DCArtboard>
      </DCSection>

      <DCSection id="v3" title="V3 · Brief refinement" subtitle="Session execution · Week view · Coach client detail · cada una en dark + light">
        <DCArtboard id="v3-session-dark" label="01 · Session execution · DARK" width={320} height={680}>
          <SessionExecutionV3 light={false} />
        </DCArtboard>
        <DCArtboard id="v3-session-light" label="01 · Session execution · LIGHT" width={320} height={680}>
          <SessionExecutionV3 light={true} />
        </DCArtboard>
        <DCArtboard id="v3-rest-dark" label="01b · Rest timer overlay · DARK" width={320} height={680}>
          <SessionRestOverlayV3 light={false} />
        </DCArtboard>
        <DCArtboard id="v3-rest-light" label="01b · Rest timer overlay · LIGHT" width={320} height={680}>
          <SessionRestOverlayV3 light={true} />
        </DCArtboard>
        <DCArtboard id="v3-week-dark" label="02 · Week view · DARK" width={320} height={680}>
          <WeekViewV3 light={false} />
        </DCArtboard>
        <DCArtboard id="v3-week-light" label="02 · Week view · LIGHT" width={320} height={680}>
          <WeekViewV3 light={true} />
        </DCArtboard>
        <DCArtboard id="v3-client-dark" label="03 · Coach · Client detail · DARK" width={1240} height={820}>
          <CoachClientDetailV3 light={false} />
        </DCArtboard>
        <DCArtboard id="v3-client-light" label="03 · Coach · Client detail · LIGHT" width={1240} height={820}>
          <CoachClientDetailV3 light={true} />
        </DCArtboard>
      </DCSection>

      <DCSection id="v2" title="V2 · Iteración" subtitle="Refinamientos: supersets · calentamiento · media viewer · energy 1-5 · drag editor">
        <DCArtboard id="v2-workout" label="Alumno · Workout detail v2" width={320} height={680}>
          <ClientWorkoutDetailV2 />
        </DCArtboard>
        <DCArtboard id="v2-session" label="Alumno · Sesión · normal" width={320} height={680}>
          <ClientSessionV2 />
        </DCArtboard>
        <DCArtboard id="v2-rest" label="Alumno · Sesión · descanso" width={320} height={680}>
          <ClientSessionRestV2 />
        </DCArtboard>
        <DCArtboard id="v2-complete" label="Alumno · Completada v2" width={320} height={680}>
          <ClientSessionCompleteV2 />
        </DCArtboard>
        <DCArtboard id="v2-editor" label="Coach · Template editor v2" width={1240} height={820}>
          <CoachTemplateEditorV2 />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
